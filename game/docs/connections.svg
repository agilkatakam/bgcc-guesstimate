<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" font-family="Arial, Helvetica, sans-serif">
  <style>
    .t { font-size: 14px; font-weight: bold; text-anchor: middle; }
    .e { font-size: 11px; text-anchor: middle; fill: #444; }
    .b { font-size: 11px; text-anchor: middle; fill: #1a1a1a; }
    .o { font-size: 11px; font-weight: bold; text-anchor: middle; }
    .l { font-size: 10.5px; fill: #333; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
    .edge { stroke: #666; stroke-width: 2; fill: none; }
  </style>
  <!-- edges first so boxes sit on top -->
  <line class="edge" x1="200" y1="170" x2="300" y2="135"/>
  <line class="edge" x1="460" y1="135" x2="560" y2="170"/>
  <line class="edge" x1="380" y1="135" x2="380" y2="320"/>
  <line class="edge" x1="120" y1="290" x2="270" y2="370"/>
  <line class="edge" x1="490" y1="370" x2="640" y2="290"/>

  <!-- A -->
  <rect x="10" y="170" width="220" height="120" rx="8" fill="#fbeeee" stroke="#7a1414" stroke-width="2"/>
  <text class="t" x="120" y="194" fill="#7a1414">A · The police case</text>
  <text class="e" x="120" y="211">Ex 1 · 4 · 8</text>
  <text class="b" x="120" y="233">Plated femur in the body; Rao's</text>
  <text class="b" x="120" y="248">chart, ID and van; case on Tara</text>
  <text class="o" x="120" y="274" fill="#7a1414">Owns claims 1 (plate) and 2</text>

  <!-- B -->
  <rect x="270" y="15" width="220" height="120" rx="8" fill="#eef3f9" stroke="#1f4e79" stroke-width="2"/>
  <text class="t" x="380" y="39" fill="#1f4e79">B · The man</text>
  <text class="e" x="380" y="56">Ex 3 · 5 · 7</text>
  <text class="b" x="380" y="78">Never broke a bone; private line</text>
  <text class="b" x="380" y="93">4471; born 14 March 1981; motive</text>
  <text class="o" x="380" y="119" fill="#1f4e79">Owns claims 1 (no fracture) and 4</text>

  <!-- D -->
  <rect x="530" y="170" width="220" height="120" rx="8" fill="#fbf4e6" stroke="#8a5a00" stroke-width="2"/>
  <text class="t" x="640" y="194" fill="#8a5a00">D · The escape</text>
  <text class="e" x="640" y="211">Ex 2 · 9 · 11</text>
  <text class="b" x="640" y="233">Passport "Arvind Menon" on forged</text>
  <text class="b" x="640" y="248">papers; Mumbai to Colombo, 9 Nov</text>
  <text class="o" x="640" y="274" fill="#8a5a00">Owns claim 6</text>

  <!-- C -->
  <rect x="270" y="320" width="220" height="120" rx="8" fill="#edf6ef" stroke="#2e6b3a" stroke-width="2"/>
  <text class="t" x="380" y="344" fill="#2e6b3a">C · The phone on the night</text>
  <text class="e" x="380" y="361">Ex 6 · 10 · 12</text>
  <text class="b" x="380" y="383">4471: Assagao 9:05, Siolim 11:20,</text>
  <text class="b" x="380" y="398">Mapusa 1:50; tip from Kankavli</text>
  <text class="o" x="380" y="424" fill="#2e6b3a">Owns claims 3 and 5</text>

  <!-- edge labels -->
  <text class="l" x="160" y="128" text-anchor="middle">plate ↔ never broke a bone</text>
  <text class="l" x="160" y="143" text-anchor="middle">Rao's chart &amp; van ↔ Rao's own file</text>
  <text class="l" x="600" y="128" text-anchor="middle">4471 + 14 March 1981</text>
  <text class="l" x="600" y="143" text-anchor="middle">= Menon's contact and birthday</text>
  <text class="l" x="390" y="222" text-anchor="start">4471 is Aryan's</text>
  <text class="l" x="390" y="237" text-anchor="start">private line</text>
  <text class="l" x="105" y="330" text-anchor="middle">"Done" from a company SIM</text>
  <text class="l" x="105" y="345" text-anchor="middle">= sent by 4471 from a bus stand;</text>
  <text class="l" x="105" y="360" text-anchor="middle">tip's words ↔ its Kankavli trace</text>
  <text class="l" x="660" y="330" text-anchor="middle">same number 4471;</text>
  <text class="l" x="660" y="345" text-anchor="middle">bus up NH66 to Mumbai</text>
  <text class="l" x="660" y="360" text-anchor="middle">↔ flight out of Mumbai</text>
  <text x="380" y="462" font-size="10.5" text-anchor="middle" fill="#555" font-style="italic">Only B says whose number 4471 is and whose birthday is on the passport: without B, C and D describe an unknown man.</text>
</svg>
